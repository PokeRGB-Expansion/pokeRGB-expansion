name: Build and verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TEST_SUITE: ${{ vars.POKERGB_TEST_SUITE || (github.repository == 'PokeRGB-Expansion/pokeRGB-expansion' && 'reference' || 'author') }}

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        # A downstream hack runs one content-aware check per preset.
        shard: ${{ fromJSON((vars.POKERGB_TEST_SUITE || (github.repository == 'PokeRGB-Expansion/pokeRGB-expansion' && 'reference' || 'author')) == 'reference' && '[1,2,3,4,5,6,7,8]' || '[1]') }}
        preset: [core, minimal]
        include:
          - os: macos-latest
            preset: core
          - os: macos-latest
            preset: minimal
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check test suite selection
        if: env.TEST_SUITE != 'author' && env.TEST_SUITE != 'reference'
        run: |
          echo "Set the POKERGB_TEST_SUITE repository variable to author or reference." >&2
          exit 1

      - name: Check out PokéRGB Expansion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out RGBDS 1.0.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gbdev/rgbds
          ref: f7b8207322aa9e3714ef0d98d01989f320103026 # v1.0.4
          path: .rgbds

      - name: Install RGBDS dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config

      - name: Install RGBDS dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bison libpng pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build RGBDS
        run: make -C .rgbds -j4

      - name: Build all three colors
        run: make -j4 PRESET=${{ matrix.preset }} RGBDS="$GITHUB_WORKSPACE/.rgbds/"

      - name: Check reference color data
        if: runner.os == 'macOS' && env.TEST_SUITE == 'reference'
        run: python3 tools/check_reference_colors.py build/${{ matrix.preset }}

      - name: Check out SameBoy 1.0.5
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LIJI32/SameBoy
          ref: ea667ad79aa28409f034b1fd6da7304e1844750d # v1.0.5
          path: .sameboy

      - name: Build the SameBoy test core
        if: runner.os == 'Linux'
        run: make -C .sameboy -j4 build/lib/libsameboy.so bootroms CONF=release RGBDS="$GITHUB_WORKSPACE/.rgbds/"

      - name: Test the built game
        if: runner.os == 'Linux' && env.TEST_SUITE == 'reference'
        run: >-
          python3 tests/run.py build/${{ matrix.preset }}
          --shard ${{ matrix.shard }} 8 --jobs 4
          --rgbds .rgbds
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin
          --sgb-boot .sameboy/build/bin/BootROMs/sgb_boot.bin

      - name: Check the hack's game data in the emulator
        if: runner.os == 'Linux' && env.TEST_SUITE == 'author'
        run: >-
          python3 tests/author_checks.py build/${{ matrix.preset }}
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin

      - name: Check specification references
        if: runner.os == 'macOS' && env.TEST_SUITE == 'reference'
        run: python3 spec/tools/validate_spec.py

      - name: Check tracked files
        run: git diff --exit-code
