name: Build and verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        preset: [core, minimal]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out PokéRGB Expansion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out RGBDS 1.0.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gbdev/rgbds
          ref: f7b8207322aa9e3714ef0d98d01989f320103026 # v1.0.4
          path: .rgbds

      - name: Install RGBDS dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libpng-dev pkg-config

      - name: Install RGBDS dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bison libpng pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build RGBDS
        run: make -C .rgbds -j4

      - name: Build all three colors
        run: make -j4 PRESET=${{ matrix.preset }} RGBDS="$GITHUB_WORKSPACE/.rgbds/"

      - name: Check reference color data
        run: python3 tools/check_reference_colors.py build/${{ matrix.preset }}

      - name: Check out SameBoy 1.0.5
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: LIJI32/SameBoy
          ref: ea667ad79aa28409f034b1fd6da7304e1844750d # v1.0.5
          path: .sameboy

      - name: Build the SameBoy test core
        if: runner.os == 'Linux'
        run: make -C .sameboy -j4 lib bootroms RGBDS="$GITHUB_WORKSPACE/.rgbds/"

      - name: Test linked cartridges
        if: runner.os == 'Linux'
        run: >-
          python3 tests/cartridge_smoke.py build/${{ matrix.preset }}
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin

      - name: Check the Super Game Boy titles
        if: runner.os == 'Linux'
        run: >-
          python3 tests/title_smoke.py build/${{ matrix.preset }}
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/sgb_boot.bin

      - name: Test battle rules, saves, and the Safari Zone
        if: runner.os == 'Linux'
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          sameboy=.sameboy/build/lib/libsameboy.so
          boot=.sameboy/build/bin/BootROMs/dmg_boot.bin
          python3 tests/adventure_checkpoints.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/battle_turn_state.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/critical_hits.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/status_medicine.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/presentation_events.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/bike_shop_sign.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/npc_entry_position.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/bicycle_fall.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/sprite_storage.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          python3 tests/interrupted_save_smoke.py "build/$PRESET"/poke*.gbc --library "$sameboy" --boot "$boot"
          if [ "$PRESET" = minimal ]; then
            python3 tests/move_swap_smoke.py "build/$PRESET"/poke*.gbc --sameboy "$sameboy" --boot "$boot" --minimal
            python3 tests/adventure_event_states.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot" --minimal
          else
            python3 tests/move_swap_smoke.py "build/$PRESET"/poke*.gbc --sameboy "$sameboy" --boot "$boot"
            python3 tests/safari_session.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
            python3 tests/adventure_event_states.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
            python3 tests/route_cut_tree.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
            python3 tests/npc_return.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
            python3 tests/ledge_landing.py "build/$PRESET" --sameboy "$sameboy" --boot "$boot"
          fi

      - name: Test a live Cable Club connection
        if: runner.os == 'Linux' && matrix.preset == 'core'
        run: |
          for room in trade battle; do
            python3 tests/link_cable_smoke.py build/core/pokered.gbc build/core/pokegreen.gbc               --room "$room" --sameboy .sameboy/build/lib/libsameboy.so               --boot .sameboy/build/bin/BootROMs/dmg_boot.bin
          done

      - name: Check a custom move in the game menus
        if: runner.os == 'Linux' && matrix.preset == 'core'
        run: >-
          python3 tests/move_info_authoring.py --rgbds .rgbds
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin

      - name: Check a custom trainer loss speech
        if: runner.os == 'Linux' && matrix.preset == 'core'
        run: >-
          python3 tests/trainer_loss_authoring.py --rgbds .rgbds
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin

      - name: Check author name lists
        if: runner.os == 'Linux' && matrix.preset == 'core'
        run: >-
          python3 tests/name_list_authoring.py --rgbds .rgbds
          --sameboy .sameboy/build/lib/libsameboy.so
          --boot .sameboy/build/bin/BootROMs/dmg_boot.bin

      - name: Check specification references
        run: python3 spec/tools/validate_spec.py

      - name: Check tracked files
        run: git diff --exit-code
